<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>TVRI Bengkulu — PPID</title>
    <style>
        :root {
            --blue: #075cae;
            --blue2: #168de0;
            --navy: #06366c;
            --red: #ee2029;
            --paper: #f3f8fd;
            --ink: #092f59;
            --drive-background-image: none
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden
        }

        body {
            font-family: Arial, Segoe UI, sans-serif;
            background: radial-gradient(ellipse at 18% 18%, rgba(22,141,224,.13), transparent 38%),
                        linear-gradient(135deg, #f8fbff 0%, #edf6fd 55%, #dcecf9 100%);
            color: var(--ink)
        }

        .screen {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            min-height: 260px;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 82% 24%, rgba(22,141,224,.16), transparent 35%),
                linear-gradient(rgba(249,252,255,.72), rgba(249,252,255,.72)),
                var(--drive-background-image, none),
                linear-gradient(135deg, #f8fbff 0%, #eef7ff 58%, #dcecf9 100%);
            background-size: auto, auto, cover, auto;
            background-position: center, center, center, center;
            background-repeat: no-repeat, no-repeat, no-repeat, no-repeat;
        }

        .batik {
            position: absolute;
            inset: 0;
            opacity: .10;
            background-image: repeating-linear-gradient(135deg, transparent 0 18px, rgba(7,92,174,.18) 19px 20px);
            background-size: 420px 420px;
            background-position: left bottom;
            pointer-events: none
        }

        .batik:after {
            content: "";
            position: absolute;
            right: -10vw;
            bottom: -25vw;
            width: 48vw;
            height: 48vw;
            border-radius: 50%;
            background: radial-gradient(circle, transparent 0 25%, var(--blue) 26% 28%, transparent 29% 37%, var(--blue) 38% 40%, transparent 41%);
            opacity: .25
        }

        .header {
            position: absolute;
            left: 3.4vw;
            right: 3.4vw;
            top: 3.2vh;
            height: 10vh;
            display: flex;
            align-items: center;
            z-index: 5
        }

        .logo {
            width: clamp(170px, 18vw, 300px);
            max-height: 9vh;
            object-fit: contain;
            object-position: left center
        }

        .header-right {
            margin-left: auto;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            min-width: 0
        }

        .date-clock {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            color: var(--navy);
            font-size: clamp(13px, 1vw, 17px);
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: .25px;
            text-align: right;
            white-space: nowrap
        }

        .pulse {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--red);
            box-shadow: 0 0 0 5px rgba(238, 32, 41, .10);
            animation: pulse 1.5s infinite
        }

        @keyframes pulse {
            50% {
                transform: scale(.65);
                opacity: .45
            }
        }

        .main {
            position: absolute;
            left: 3.4vw;
            right: 3.4vw;
            top: 15vh;
            bottom: 33.2vh;
            display: grid;
            grid-template-columns: 1.05fr .95fr;
            gap: 2vw;
            min-height: 0
        }

        .card {
            position: relative;
            min-width: 0;
            min-height: 0;
            border-radius: 0;
            overflow: hidden;
            box-shadow: 0 14px 38px rgba(6, 54, 108, .16);
            border: 1px solid rgba(255, 255, 255, .9)
        }

        .video-card {
            background: transparent
        }

        .video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: transparent;
            object-fit: contain;
            pointer-events: none
        }

        .video-shade {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(3, 33, 64, .02) 45%, rgba(3, 28, 57, .8))
        }

        .video-live-dot {
            position: absolute;
            left: 18px;
            bottom: 18px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--red);
            box-shadow: 0 0 0 5px rgba(238, 32, 41, .14), 0 0 14px rgba(238, 32, 41, .55);
            animation: pulse 1.5s infinite;
            z-index: 3;
            pointer-events: none
        }

        .video-live-dot[hidden] { display: none !important; }

        .live {
            position: absolute;
            left: 18px;
            top: 17px;
            background: var(--red);
            color: white;
            padding: 7px 11px;
            border-radius: 999px;
            font-size: clamp(9px, .75vw, 13px);
            font-weight: 900;
            z-index: 2
        }

        .live i {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #fff;
            border-radius: 50%;
            margin-right: 6px
        }

        /* .vinfo {
            position: absolute;
            left: 22px;
            right: 22px;
            bottom: 18px;
            color: #fff
        } */

        .vinfo {
            position: absolute;
            left: 22px;
            top: 18px;
            /* <--- Diumbahkan ke atas */
            bottom: auto;
            /* <--- Menghapus posisi bawah */
            color: #fff;
            z-index: 3;
            /* <--- Agar berada di atas lapisan video-shade */
        }

        .vinfo small {
            font-size: clamp(8px, .65vw, 12px);
            font-weight: 800;
            letter-spacing: 1.4px;
            opacity: .85
        }

        .vinfo h1 {
            font-size: clamp(17px, 1.9vw, 32px);
            line-height: 1.05;
            margin: 5px 0 4px
        }

        .vinfo span {
            font-size: clamp(8px, .7vw, 12px);
            opacity: .8
        }

        .news {
            background: transparent
        }

        /* .news-head {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 31%;
            padding: 18px 20px;
            background: linear-gradient(135deg, #fff, #eaf6ff);
            z-index: 2
        } */

        .eyebrow {
            font-size: clamp(8px, .65vw, 12px);
            font-weight: 900;
            letter-spacing: 1.2px;
            color: var(--blue2)
        }

        /* .news-head h2 {
            font-size: clamp(15px, 1.45vw, 25px);
            line-height: 1.08;
            margin: 7px 0 0
        } */

        .meta {
            font-size: clamp(8px, .58vw, 11px);
            color: #6c89a4;
            margin-top: 6px
        }

        .slides {
            position: absolute;
            inset: 0 0 0;
            background: transparent
        }

        .photo-empty {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: rgba(255,255,255,.78);
            font-size: clamp(10px, .9vw, 15px);
            font-weight: 800;
            text-align: center;
            letter-spacing: .4px
        }

        .photo-empty.hidden { display: none; }

        .slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity .65s
        }

        .slide.active {
            opacity: 1
        }

        .caption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2;
            padding: 32px 64px 16px 20px;
            color: #fff;
            background: linear-gradient(transparent, rgba(0, 28, 57, .9));
            font-size: clamp(16px, 1.35vw, 24px);
            line-height: 1.25;
            font-weight: 800;
            text-shadow: 0 1px 3px rgba(0,0,0,.45);
            pointer-events: none
        }

        .caption[hidden] { display: none !important; }

        .caption-name {
            display: block;
            font-size: clamp(16px, 1.35vw, 24px);
            line-height: 1.25;
            font-weight: 800
        }

        .caption-date {
            display: block;
            margin-top: 5px;
            font-size: clamp(12px, .95vw, 16px);
            line-height: 1.2;
            font-weight: 500;
            opacity: .92
        }

        .caption-date:empty { display: none; }

        .dots {
            position: absolute;
            right: 15px;
            bottom: 12px;
            display: flex;
            gap: 5px
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 10px;
            background: #ffffff77
        }

        .dot.active {
            width: 18px;
            background: #fff
        }

        .bar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 6.2vh;
            height: 20%;
            min-height: 80px;
            display: grid;
            /* grid-template-columns: 10% 16% 32% 20% 1fr; */
            grid-template-columns: 9% 11% 19% 20% 24% 17%;
            align-items: center;
            gap: 1.2vw;
            padding: 0 3.4vw;
            /* background: rgba(249, 252, 255, .95); */
            background:
                linear-gradient(135deg, rgba(249,252,255,.88), rgba(229,242,253,.86)),
                var(--drive-background-image, none);
            background-size: auto, cover;
            background-position: center, center;
            background-repeat: no-repeat, no-repeat;
            border-top: 1px solid #075cae22;
            box-shadow: 0 -10px 30px #06366c12;
            z-index: 4;
            backdrop-filter: blur(10px)
        }

        .bar:before {
            content: "";
            position: absolute;
            inset: 0;
            opacity: .055;
            background-image: repeating-linear-gradient(135deg, transparent 0 13px, rgba(7,92,174,.18) 14px 15px);
            background-size: 250px 250px
        }

        .bitem {
            position: relative;
            z-index: 1
        }

        .livebox {
            background: var(--blue);
            color: #dcecff;
            font-weight: 900;
            padding: 8px 11px;
            border-radius: 6px;
            font-size: clamp(14px, 1.25vw, 20px);
            width: max-content;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .live-dot-inline {
            width: 9px;
            height: 9px;
            flex: 0 0 9px;
            border-radius: 50%;
            background: var(--red);
            box-shadow: 0 0 0 3px rgba(238, 32, 41, .14), 0 0 9px rgba(238, 32, 41, .45);
            animation: pulse 1.5s infinite;
        }

        .livebox.is-live { background: var(--red); }

        .tdklivebox {
            background: var(--blue);
            color: white;
            font-weight: 900;
            padding: 8px 11px;
            border-radius: 6px;
            font-size: clamp(12px, 1.1vw, 17px);
            width: max-content
        }

        .time {
            text-align: center
        }

        .time small {
            display: block;
            color: #82b5df;
            font-size: clamp(12px, .95vw, 16px);
            font-weight: 800
        }

        .time strong {
            /* display: block;
            font-size: clamp(27px, 3vw, 50px);
            line-height: .9 */

            display: block;
            /* font-size: clamp(14px, 1.55vw, 26px); */
            font-size: clamp(23px, 2.2vw, 40px);
            /* Samakan batas rentangnya dengan .program b */
            line-height: 1.1;
            margin: 2px 0;
        }

        .program {
            display: flex;
            flex-direction: column;
            justify-content: center;
            /* Memaksa isi teks tepat berada di tengah secara vertikal */
            height: 100%;
            /* Mengambil tinggi penuh dari .bar */
        }

        .program small,
        .theme small {
            display: block;
            color: var(--blue2);
            font-size: clamp(15px, 1.05vw, 19px);
            font-weight: 900;
            letter-spacing: .6px;
        }
        
        .program b {
            display: block;
            font-size: clamp(27px, 2.3vw, 44px);
            line-height: 1.1;
            margin: 2px 0;
        }
        
        .program span {
            font-size: clamp(15px, 1.05vw, 19px);
            color: var(--blue2);
            font-weight: 800;
        }
        
        .theme b {
            display: block;
            font-size: clamp(18px, 1.4vw, 26px);
        }
        .corner {
            height: 100%;
            position: relative;
            overflow: hidden
        }

        .corner:before,
        .corner:after {
            content: "";
            position: absolute;
            right: -20%;
            width: 125%;
            height: 25px;
            background: var(--navy);
            transform: skewX(-38deg) rotate(-8deg)
        }

        .corner:before {
            top: 28%
        }

        .corner:after {
            top: 55%
        }

        /* BMKG weather panel - menggantikan elemen dekoratif sudut kanan bawah */
        .weather-panel {
            height: 100%;
            min-width: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 1vw;
            position: relative;
            z-index: 2;
            overflow: hidden;
            padding: 0 0 0 8px;
        }

        .weather-panel .weather-view,
        .weather-panel .budget-view {
            min-width: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            column-gap: clamp(8px, 1vw, 14px);
        }

        .weather-panel .budget-view {
            border-left: 1px solid rgba(7,92,174,.15);
            padding-left: 1vw;
        }

        .weather-content {
            min-width: 0;
            width: 100%;
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            column-gap: 10px;
            text-align: left;
        }

        .weather-icon {
            font-size: clamp(28px, 2.8vw, 48px);
            line-height: 1;
            width: 1.15em;
            text-align: center;
        }

        .weather-main {
            min-width: 0;
        }

        .weather-location {
            color: var(--blue2);
            font-size: clamp(8px, .62vw, 12px);
            font-weight: 900;
            letter-spacing: .6px;
            white-space: normal;
            overflow: visible;
            text-overflow: clip;
            overflow-wrap: anywhere;
        }

        .weather-temp {
            color: var(--navy);
            font-size: clamp(19px, 2vw, 34px);
            font-weight: 900;
            line-height: 1;
            white-space: nowrap;
        }

        .weather-desc {
            color: var(--ink);
            font-size: clamp(8px, .65vw, 12px);
            font-weight: 800;
            white-space: normal;
            overflow: visible;
            text-overflow: clip;
            overflow-wrap: anywhere;
        }

        .weather-meta {
            color: #6c89a4;
            font-size: clamp(7px, .52vw, 10px);
            font-weight: 700;
            margin-top: 2px;
            white-space: nowrap;
        }

        .weather-source {
            position: absolute;
            right: 0;
            bottom: 3px;
            color: #7a96ad;
            font-size: clamp(6px, .45vw, 8px);
            font-weight: 700;
            white-space: nowrap;
        }

        .weather-loading .weather-icon {
            animation: pulse 1.5s infinite;
        }


        /* Cuaca dan realisasi anggaran memakai SATU area yang sama dan tampil bergantian. */
        .footer-info-view {
            width: 100%;
            height: 100%;
        }

        .weather-view {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer-info-view[hidden] {
            display: none !important;
        }

        .budget-view {
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 0 0 0 8px;
        }

        /* Running text - layout only. Data source/JS tetap tidak diubah. */
        .news-ticker-container {
            position: absolute;
            left: 3.4vw;
            right: 3.4vw;
            bottom: 0;
            height: 6.2vh;
            min-height: 34px;
            display: flex;
            align-items: stretch;
            z-index: 5;
            overflow: hidden;
            border-radius: 5px;
            box-shadow: 0 6px 18px rgba(6,54,108,.12);
            background: rgba(255,255,255,.94);
            border: 1px solid rgba(7,92,174,.16);
        }

        .ticker-badge {
            width: clamp(58px, 5.5vw, 88px);
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--blue);
        }

        .ticker-logo {
            width: 72%;
            height: 72%;
            object-fit: contain;
        }

        .ticker-megaphone {
            font-size: clamp(24px, 2.2vw, 38px);
            line-height: 1;
            display: block;
        }

        .ticker-content {
            min-width: 0;
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0 18px;
            overflow: hidden;
        }

        .ticker-text {
            width: max-content;
            min-width: 100%;
            color: var(--navy);
            font-size: clamp(12px, 1.05vw, 19px);
            line-height: 1.15;
            font-weight: 800;
            white-space: nowrap;
            overflow: visible;
            text-overflow: clip;
        }

        .ticker-content.is-scrolling .ticker-text {
            animation: tickerScroll var(--ticker-duration, 12s) linear 1 forwards !important;
            padding-right: 8vw;
        }

        .ticker-text.ticker-leave {
            animation: tickerLeave .8s ease-in forwards !important;
        }
        .ticker-text.ticker-enter {
            animation: tickerEnter .8s ease-out forwards !important;
        }
        @keyframes tickerLeave {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-100%); }
        }
        @keyframes tickerEnter {
            0% { opacity: 0; transform: translateY(100%); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes tickerScroll {
            0%, 12% { transform: translateX(0); }
            88%, 100% { transform: translateX(calc(-1 * var(--ticker-overflow, 0px))); }
        }

        /* Anggaran dan cuaca berada berdampingan pada area footer.
           Nilai anggaran sengaja hanya layout/placeholder; sumber data belum diubah. */
        .budget-widget {
            min-width: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding-right: 4px;
        }

        .budget-info {
            min-width: 0;
            overflow: visible;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .budget-title {
            color: var(--blue2);
            font-size: clamp(8px, .62vw, 12px);
            font-weight: 900;
            letter-spacing: .5px;
            white-space: normal;
            overflow: visible;
            text-overflow: clip;
        }

        .budget-amount {
            color: var(--navy);
            font-size: clamp(11px, 1.05vw, 20px);
            font-weight: 900;
            line-height: 1.1;
            white-space: normal;
            overflow: visible;
            text-overflow: clip;
            overflow-wrap: anywhere;
        }

        .budget-chart-container {
            position: relative;
            width: clamp(42px, 4vw, 62px);
            height: clamp(42px, 4vw, 62px);
            flex: 0 0 auto;
        }

        .budget-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .budget-circle-bg {
            fill: none;
            stroke: #dceaf6;
            stroke-width: 3.2;
        }

        .budget-circle-progress {
            fill: none;
            stroke: var(--blue);
            stroke-width: 3.2;
            stroke-linecap: round;
            stroke-dasharray: 100, 100;
            stroke-dashoffset: 70;
        }

        .budget-center-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--navy);
            font-size: clamp(9px, .72vw, 13px);
            font-weight: 900;
        }

        /* portrait mobile: one viewport, no scroll */
        @media(max-width:700px) and (orientation:portrait) {
            .header {
                top: 2vh;
                left: 4vw;
                right: 4vw;
                height: 8vh
            }

            .logo {
                width: 45%;
                max-height: 7vh
            }

            .header-right {
                gap: 2px
            }

            .date-clock {
                font-size: 9px;
                letter-spacing: 0;
                gap: 5px
            }

            .video-live-dot {
                left: 10px;
                bottom: 10px;
                width: 8px;
                height: 8px
            }

            .main {
                left: 4vw;
                right: 4vw;
                top: 11vh;
                bottom: 24vh;
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1.05fr;
                gap: 2.2vw
            }

            .card {
                border-radius: 0
            }

            .live {
                left: 10px;
                top: 10px;
                padding: 5px 8px;
                font-size: 8px
            }

            /* .vinfo {
                left: 12px;
                right: 12px;
                bottom: 9px
            } */

            .vinfo {
                left: 12px;
                top: 10px;
                bottom: auto;
            }

            .vinfo small {
                font-size: 6px
            }

            .vinfo h1 {
                font-size: 12px;
                margin: 3px 0
            }

            .vinfo span {
                font-size: 6px
            }

            /* .news-head {
                height: 35%;
                padding: 9px 11px
            } */

            .eyebrow {
                font-size: 7px
            }

            /* .news-head h2 {
                font-size: 11px;
                margin-top: 3px
            } */

            .meta {
                font-size: 6px;
                margin-top: 3px
            }

            .slides {
                inset: 0 0 0
            }

            .caption {
                padding: 26px 34px 11px 11px;
                font-size: 15px
            }

            .caption-name { font-size: 15px; }
            .caption-date { font-size: 10px; margin-top: 4px; }

            .dots {
                right: 9px;
                bottom: 8px
            }

            .dot {
                width: 5px;
                height: 5px
            }

            .dot.active {
                width: 13px
            }

            .news-ticker-container {
                left: 4vw;
                right: 4vw;
                bottom: 17%;
                height: 6vh;
                min-height: 28px;
            }

            .ticker-badge { width: 46px; }
            .ticker-content { padding: 0 9px; }
            .ticker-text { font-size: 9px; }

            .bar {
                height: 17%;
                min-height: 0;
                padding: 0 4vw;
                /* grid-template-columns: 20% 28% 52%; */
                grid-template-columns: 16% 22% 32% 20% 10%;
                /* Ditambah kolom ke-4 (10%) untuk tempat .corner */
                gap: 1vw

<body>
    <div class="screen">
        <div class="batik"></div>
        <header class="header">

        <div class="news-ticker-container" aria-label="Running text TVRI Bengkulu">

            </div>
            <div class="ticker-content"><div class="ticker-text" id="runningTextDisplay">INFORMASI TVRI BENGKULU</div></div>
        </div>
        <footer class="bar">
            <div class="bitem livebox" id="liveBox" hidden><span class="live-dot-inline" aria-hidden="true"></span><span class="live-text">LIVE</span></div>

                <strong id="currentStart">--:--</strong>

            </div>
            <div class="bitem program"><small id="programLabel">PROGRAM</small><b id="programName">Menunggu data program…</b><span id="programStation">TVRI BENGKULU</span></div>
            <div class="bitem theme"><small>DESKRIPSI PROGRAM</small><b id="programDescription">Informasi program TVRI Bengkulu.</b></div>
            <div class="bitem weather-panel" id="weatherPanel" aria-label="Realisasi anggaran">
                <div class="budget-view footer-info-view" id="budgetView">
                    <div class="budget-info">
                        <span class="budget-title" id="budgetTitle">REALISASI ANGGARAN</span>

                    </div>
                    <div class="budget-chart-container" aria-hidden="true">
                        <svg class="budget-svg" viewBox="0 0 36 36">
                            <path class="budget-circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path class="budget-circle-progress" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        </svg>

                    </div>

        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"></script>
    <script src="./config.js"></script>
    <script>
        // TVRI GitHub Pages: jadwal CSV dari Drive dan foto dari Apps Script JSONP; video HANYA dari videos.json di repo GitHub.
        const PHOTO_MS = 8000;
        const MAX_PHOTOS = 15;
        const DISPLAY_CACHE_KEY = 'tvriDisplayDataCacheV1';
        // Developer configuration: ubah hanya VIDEO_SOURCE_MODE untuk memilih sumber video.
        // 'repo' = video dari videos.json pada repositori GitHub.
        // 'live' = siaran OTT TVRI Bengkulu melalui HLS.
        // Tidak ada tombol pilihan sumber pada tampilan publik.
        const VIDEO_SOURCE_MODE = 'repo';
        const LIVE_STREAM_URL = 'https://ott.tvri.co.id/Content/HLS/Live/Channel(TVRIBengkulu)/index.m3u8';
        const VIDEO_MANIFEST_URL = './videos.json';
        const state = {
            programs: [], photos: [], videos: [], runningTexts: [], budget: null,
            videoIndex: 0, videoSignature: '', photoSignature: '', photoIndex: 0,
            photoTimer: null, videoLoadToken: 0, dataScript: null,
            dataLoading: false, videosLoading: false, hls: null
        };
        const $ = id => document.getElementById(id);
        const pad = n => String(n).padStart(2, '0');
        const DISPLAY_TIME_ZONE = 'Asia/Jakarta';

        // BMKG: prakiraan cuaca untuk Kelurahan Pagar Dewa, Kota Bengkulu.
        // API resmi BMKG menggunakan kode wilayah administrasi tingkat IV.
        const BMKG_API_URL = 'https://api.bmkg.go.id/publik/prakiraan-cuaca?adm4=17.71.01.1001';
        const BMKG_REFRESH_MS = 30 * 60 * 1000;
        let bmkgLoading = false;

        function weatherIcon(description) {
            const d = String(description || '').toLowerCase();
            if (d.includes('petir') || d.includes('badai')) return '⛈️';
            if (d.includes('hujan')) return d.includes('lebat') || d.includes('sedang') ? '🌧️' : '🌦️';
            if (d.includes('kabut') || d.includes('asap')) return '🌫️';
            if (d.includes('berawan')) return d.includes('tebal') ? '☁️' : '🌤️';
            if (d.includes('cerah')) return '☀️';
            return '🌤️';
        }

        function weatherTimeValue(item) {
            const raw = firstText(item && item.local_datetime, item && item.datetime);
            const time = Date.parse(raw);
            return Number.isNaN(time) ? 0 : time;
        }

        function flattenBmkgForecast(payload) {
            const source = payload && Array.isArray(payload.data) ? payload.data : [];
            const result = [];
            source.forEach(day => {
                const groups = Array.isArray(day && day.cuaca) ? day.cuaca : [];
                groups.forEach(group => {
                    if (Array.isArray(group)) group.forEach(item => result.push(item));
                    else if (group && typeof group === 'object') result.push(group);
                });
            });
            return result;
        }

        async function loadWeather() {
            if (bmkgLoading) return;
            bmkgLoading = true;
            $('weatherHeaderPanel').classList.add('weather-loading');

            try {
                const response = await fetch(BMKG_API_URL + '&_=' + Date.now(), {
                    cache: 'no-store'
                });
                if (!response.ok) throw new Error('BMKG HTTP ' + response.status);

                const payload = await response.json();
                const forecasts = flattenBmkgForecast(payload);
                if (!forecasts.length) throw new Error('Data prakiraan BMKG kosong.');

                const now = Date.now();
                const future = forecasts
                    .filter(item => weatherTimeValue(item) >= now - 3 * 60 * 60 * 1000)
                    .sort((a, b) => weatherTimeValue(a) - weatherTimeValue(b));
                const current = future[0] || forecasts[0];

                const location = payload.lokasi || {};
                const temp = current.t;
                const humidity = current.hu;
                const wind = current.ws;
                const description = firstText(current.weather_desc, current.weather, current.weather_desc_en, 'Data cuaca tersedia');
                const city = firstText(location.kotkab, location.kecamatan, 'Bengkulu');

                $('weatherLocation').textContent = String(city).toUpperCase();
                $('weatherTemp').textContent = (temp !== undefined && temp !== null && temp !== '') ? `${temp}°C` : '--°C';
                $('weatherDesc').textContent = description;
                $('weatherMeta').textContent =
                    `${humidity !== undefined && humidity !== null ? humidity + '%' : '--%'} • ` +
                    `${wind !== undefined && wind !== null ? wind + ' km/jam' : '-- km/jam'}`;
                $('weatherIcon').textContent = weatherIcon(description);

                const updated = current.local_datetime || current.datetime || '';
                if (updated) $('weatherHeaderPanel').title = `Prakiraan BMKG: ${updated}`;
            } catch (error) {
                console.warn('Gagal mengambil prakiraan cuaca BMKG:', error);
                $('weatherLocation').textContent = 'BENGKULU';
                $('weatherTemp').textContent = '--°C';
                $('weatherDesc').textContent = 'Cuaca tidak tersedia';
                $('weatherMeta').textContent = 'Sumber: BMKG';
                $('weatherIcon').textContent = '☁️';
            } finally {
                bmkgLoading = false;
                $('weatherHeaderPanel').classList.remove('weather-loading');
            }
        }

        // Waktu program harus mengikuti WIB meskipun timezone komputer atau
        // spreadsheet berbeda. Ini hanya membaca jam lokal; tidak melakukan polling.
        function jakartaParts(d = new Date()) {
            const parts = new Intl.DateTimeFormat('en-US', {
                timeZone: DISPLAY_TIME_ZONE,
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                hourCycle: 'h23'
            }).formatToParts(d);
            const values = {};
            parts.forEach(part => { if (part.type !== 'literal') values[part.type] = part.value; });
            const hour = Number(values.hour) % 24;
            return {
                dateKey: `${values.year}-${values.month}-${values.day}`,
                hour,
                minute: Number(values.minute),
                second: Number(values.second),
                seconds: hour * 3600 + Number(values.minute) * 60 + Number(values.second)
            };
        }
        function localDateKey(d = new Date()) { return jakartaParts(d).dateKey; }
        function parseSeconds(v) {
            const s = String(v ?? '').trim();
            const m = s.match(/^(\d{1,3}):(\d{2})(?::(\d{2}))?$/);
            if (m) return Number(m[1])*3600 + Number(m[2])*60 + Number(m[3] || 0);
            const iso = s.match(/T(\d{2}):(\d{2}):(\d{2})/);
            return iso ? Number(iso[1])*3600 + Number(iso[2])*60 + Number(iso[3]) : 0;
        }
        function firstText(...values) {
            for (const value of values) {
                const text = String(value == null ? '' : value).trim();
                if (text) return text;
            }
            return '';
        }
        function programStartSeconds(p) {
            return parseSeconds(p && (p.start_time ?? p.startTime ?? p['Start time']));
        }
        function todayPrograms(now = new Date()) {
            return state.programs.filter(p => String(p.date || p.Date || '').slice(0,10) === localDateKey(now))
                .slice().sort((a,b) => programStartSeconds(a) - programStartSeconds(b));
        }
        function clockText(value) {
            const sec = typeof value === 'number' ? value : parseSeconds(value);
            return `${pad(Math.floor(sec / 3600) % 24)}.${pad(Math.floor((sec % 3600) / 60))}`;
        }
        function renderClock() {
            const d = new Date();
            const parts = jakartaParts(d);
            const date = d.toLocaleDateString('id-ID', {
                weekday:'long', day:'2-digit', month:'long', year:'numeric', timeZone:DISPLAY_TIME_ZONE
            }).toUpperCase();
            $('dateClock').textContent = `${date} | ${pad(parts.hour)}:${pad(parts.minute)} WIB`;
        }
        function renderProgram() {
            const now = new Date();
            const nowParts = jakartaParts(now);
            const nowSeconds = nowParts.seconds;
            const list = todayPrograms(now);
            if (!list.length) {
                $('programLabel').textContent = 'PROGRAM';
                $('programName').textContent = 'Belum ada jadwal hari ini';
                $('programDescription').textContent = '-';
                $('programDescription').classList.remove('is-short-description');
                document.querySelector('.screen .bar .theme')?.classList.remove('has-short-description');
                $('programStation').textContent = '—';
                $('currentStart').textContent = '--:--';
                $('prevTime').textContent = '';
                $('nextTime').textContent = '';
                $('liveBox').innerHTML = '<span class="live-dot-inline" aria-hidden="true"></span><span class="live-text">LIVE</span>';
                $('liveBox').classList.remove('is-live');
                $('liveBox').hidden = true;
                return;
            }

            let index = -1;
            for (let i = 0; i < list.length; i++) {
                const startSec = programStartSeconds(list[i]);
                const durationSec = parseSeconds(list[i].duration ?? list[i].Duration);
                const endSec = startSec + durationSec;
                if (durationSec > 0 && nowSeconds >= startSec && nowSeconds < endSec) {
                    index = i;
                    break;
                }
            }
            const active = index >= 0;
            if (!active) {
                index = list.findIndex(p => programStartSeconds(p) > nowSeconds);
                if (index < 0) index = list.length - 1;
            }

            const p = list[index];
            const startSec = programStartSeconds(p);
            const programName = firstText(p.name, p.Name, p.program_name, p.programName, p.title);
            // Short description diprioritaskan; jika kosong, gunakan description/long description.
            // Header CSV dengan spasi atau kapitalisasi umum juga diterima.
            const shortDescription = firstText(
                p.short_description, p.shortDescription,

            const longDescription = firstText(
                p.long_description, p.longDescription,
                p['long description'], p['Long Description'], p['LONG DESCRIPTION']
            );
            // Urutan yang diminta: Short Description dahulu, lalu Long Description,
            // baru kolom description umum sebagai fallback.
            const programDescription = firstText(
                shortDescription, longDescription,
                p.description, p.Description, p['description'], p['Description']
            );
            const usesShortDescription = Boolean(
                shortDescription && programDescription === shortDescription
            );
            // Baca kolom LIVE/LIVE secara fleksibel dari CSV, tanpa bergantung
            // pada kapitalisasi nama header atau posisi kolom.
            const liveEntry = Object.entries(p).find(([key]) => String(key).trim().toLowerCase() === 'live');
            const liveValue = String(
                liveEntry ? liveEntry[1] : (p.live ?? p.Live ?? p.LIVE ?? p['Live'] ?? p['LIVE'] ?? '')
            ).trim().toLowerCase();
            const live = liveValue === 'ya';
            const previousProgram = index > 0 ? list[index - 1] : null;
            const nextProgram = index < list.length - 1 ? list[index + 1] : null;
            const previousProgramName = previousProgram
                ? firstText(previousProgram.name, previousProgram.Name, previousProgram.program_name, previousProgram.programName, previousProgram.title)
                : '—';
            const nextProgramName = nextProgram
                ? firstText(nextProgram.name, nextProgram.Name, nextProgram.program_name, nextProgram.programName, nextProgram.title)
                : '—';

            $('programName').textContent = programName || 'Tanpa judul';
            $('programDescription').textContent = programDescription || 'Tidak ada deskripsi program.';
            $('programDescription').classList.toggle('is-short-description', usesShortDescription);
            document.querySelector('.screen .bar .theme')?.classList.toggle('has-short-description', usesShortDescription);
            $('programStation').textContent = nextProgramName || '—';
            $('currentStart').textContent = clockText(startSec);
            $('prevTime').textContent = index > 0 ? clockText(programStartSeconds(list[index-1])) : '';
            $('nextTime').textContent = index < list.length-1 ? clockText(programStartSeconds(list[index+1])) : '';
            $('liveBox').innerHTML = '<span class="live-dot-inline" aria-hidden="true"></span><span class="live-text">LIVE</span>';
            $('liveBox').classList.toggle('is-live', live);

        // Foto dapat berasal dari URL gambar langsung atau tautan publik dari beberapa host.
        // Google Drive tetap didukung; tautan GitHub /blob dan Dropbox share dinormalisasi.
        function normalizePhotoUrl(raw) {
            let value = String(raw == null ? '' : raw).trim();
            if (!value) return '';

            // Boleh menerima URL langsung, formula HYPERLINK, dan Markdown [judul](URL).
            const markdownLink = value.match(/^\s*\[[^\]]*\]\((https?:\/\/[^)]+)\)\s*$/i);
            if (markdownLink) value = markdownLink[1].trim();
            const hyperlinkFormula = value.match(/^\s*=HYPERLINK\s*\(\s*["']([^"']+)["']/i);
            if (hyperlinkFormula) value = hyperlinkFormula[1].trim();
            value = value.replace(/^['"]|['"]$/g, '').trim();
            if (!value) return '';

            let url;
            try {
                url = new URL(value, window.location.href);
            } catch (_) {
                return '';
            }

            const host = url.hostname.toLowerCase();

            // Google Drive: ubah tautan berbagi menjadi URL gambar yang bisa dimuat <img>.
            if ((host === 'drive.google.com' || host === 'docs.google.com') && driveFileId(value)) {
                return driveImageUrl(value);
            }

            // Dropbox: tautan berbagi menjadi endpoint pratinjau file langsung.
            if (host === 'dropbox.com' || host.endsWith('.dropbox.com')) {
                url.searchParams.delete('dl');
                url.searchParams.set('raw', '1');
                return url.toString();
            }

            // GitHub file page (/blob/) menjadi raw file URL; URL GitHub Pages biasa dibiarkan.
            if (host === 'github.com') {
                const parts = url.pathname.split('/').filter(Boolean);
                const blobIndex = parts.indexOf('blob');
                if (parts.length >= 4 && blobIndex === 2) {
                    const owner = parts[0];
                    const repo = parts[1];
                    const branchAndPath = parts.slice(3).join('/');
                    return `https://raw.githubusercontent.com/${owner}/${repo}/${branchAndPath}${url.search}`;
                }
            }

            // URL gambar langsung dari host lain (mis. Imgur, Cloudinary, server sendiri)
            // dan path relatif GitHub Pages digunakan tanpa perubahan.
            return value;
        }

        function photoUrl(item) {
            const raw = typeof item === 'string' ? item : firstText(
                item && item.mediaUrl,
                item && item.media_url,
                item && item.image,
                item && item.Image,
                item && item.imageUrl,
                item && item.image_url,
                item && item['Image URL'],
                item && item['Image Link'],
                item && item.photoUrl,
                item && item.photo_url,
                item && item.foto_url,
                item && item.url_foto,
                item && item.link_foto,
                item && item['Photo URL'],
                item && item['Photo Link'],
                item && item['Link Foto'],
                item && item['URL Foto'],
                item && item['Tautan Foto'],
                item && item.photo,
                item && item.Photo,
                item && item.foto,
                item && item.Foto,
                item && item.gambar,
                item && item.Gambar,
                item && item.url,
                item && item.URL,
                item && item.link,
                item && item.Link,
                item && item.src
            );
            return normalizePhotoUrl(raw);
        }
        function getPhotoList() {
            // Urutan data mengikuti baris di Sheet: entri terbaru berada paling akhir.
            // Tampilkan maksimal 15 foto terbaru, tanpa memfilter atau mengurutkan berdasarkan tanggal.
            return state.photos
                .filter(p => !!photoUrl(p))
                .slice(-MAX_PHOTOS)
                .reverse();
        }
        function photoKey(list) { return list.map(p => `${p.id || ''}|${photoUrl(p)}|${String(p.name || '').trim()}|${String(p.date || '').trim()}`).join('||'); }
        function setPhotoCaption(item) {
            const caption = $('photoCaption');
            const name = String(item && item.name || '').trim();
            const date = formatPhotoDate(item && item.date);
            $('photoCaptionName').textContent = name;
            $('photoCaptionDate').textContent = date;
            caption.hidden = !(name || date);
        }
        function formatPhotoDate(value) {
            const raw = String(value == null ? '' : value).trim();
            if (!raw) return '';
            let year, month, day;
            let match = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
            if (match) {
                year = Number(match[1]); month = Number(match[2]); day = Number(match[3]);
            } else {
                match = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
                if (match) {
                    month = Number(match[1]); day = Number(match[2]); year = Number(match[3]);
                }
            }
            if (year && month >= 1 && month <= 12 && day >= 1 && day <= 31) {
                const date = new Date(year, month - 1, day);
                if (date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day) {
                    return date.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
                }
            }
            const parsed = new Date(raw);
            return Number.isNaN(parsed.getTime()) ? raw : parsed.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
        }
        function renderPhotos() {
            const list = getPhotoList();
            const stage = $('slides');
            const dots = $('dots');
            stage.querySelectorAll('.slide').forEach(el => el.remove());
            dots.replaceChildren();
            clearInterval(state.photoTimer);
            state.photoTimer = null;
            state.photoIndex = 0;
            if (!list.length) {
                $('photoEmpty').classList.remove('hidden');
                setPhotoCaption(null);
                return;
            }
            $('photoEmpty').classList.add('hidden');
            setPhotoCaption(list[0]);
            list.forEach((item, i) => {
                const img = document.createElement('img');
                // Explicitly send a referrer origin for direct image requests; no proxy is used.
                // This tests whether the source blocks requests made with no-referrer policy.
                img.referrerPolicy = 'strict-origin-when-cross-origin';
                img.className = 'slide' + (i === 0 ? ' active' : '');
                img.alt = item.name || `Foto berita ${i+1}`;
                img.loading = i < 2 ? 'eager' : 'lazy';
                img.decoding = 'async';
                if (i === 0) img.setAttribute('fetchpriority', 'high');
                // Foto dimuat langsung dari URL asli. Tidak menggunakan proxy.
                // Gunakan kebijakan referrer default browser agar server sumber dapat
                // menerapkan kebijakan akses normalnya.
                const originalPhotoUrl = photoUrl(item);
                img.dataset.originalPhotoUrl = originalPhotoUrl;
                img.onerror = () => {
                    const original = img.dataset.originalPhotoUrl || '';

                    // Proxy hanya dicoba sebagai fallback untuk gambar dari domain TVRI.
                    // Google Drive dan seluruh sumber lain tetap memakai URL normalnya.
                    let sourceUrl = null;
                    try { sourceUrl = new URL(original); } catch (_) {}
                    const host = sourceUrl ? sourceUrl.hostname.toLowerCase() : '';
                    const isTvriSource = host === 'tvri.go.id' || host.endsWith('.tvri.go.id');

                    if (isTvriSource && img.dataset.tvriProxyAttempted !== '1' && sourceUrl) {
                        img.dataset.tvriProxyAttempted = '1';
                        const proxy = new URL('https://images.weserv.nl/');
                        const sourceForProxy = (sourceUrl.protocol === 'https:' ? 'ssl:' : '') +
                            sourceUrl.host + sourceUrl.pathname + sourceUrl.search;
                        proxy.searchParams.set('url', sourceForProxy);
                        console.warn('Foto TVRI gagal dimuat langsung; mencoba proxy khusus TVRI:', proxy.toString());
                        img.src = proxy.toString();
                        return;
                    }

                    img.classList.add('broken');
                    console.warn('Foto gagal dimuat setelah percobaan sumber:', original, 'Sumber terakhir:', img.currentSrc || img.src);
                };
                img.src = originalPhotoUrl;
                stage.insertBefore(img, dots);
                const dot = document.createElement('span');
                dot.className = 'dot' + (i === 0 ? ' active' : '');
                dots.appendChild(dot);
            });
            if (list.length > 1) state.photoTimer = setInterval(nextPhoto, PHOTO_MS);
        }
        function nextPhoto() {
            const slides = [...$('slides').querySelectorAll('.slide')];
            const dots = [...$('dots').children];
            if (slides.length < 2) return;
            slides[state.photoIndex].classList.remove('active');
            dots[state.photoIndex]?.classList.remove('active');
            state.photoIndex = (state.photoIndex + 1) % slides.length;
            slides[state.photoIndex].classList.add('active');
            dots[state.photoIndex]?.classList.add('active');
            const list = getPhotoList();
            setPhotoCaption(list[state.photoIndex]);
        }

        // Isi dengan tautan berbagi atau ID file gambar di Google Drive.
        // Kosongkan sementara jika aset belum diunggah.
        const DRIVE_ASSETS = {
            logo: 'https://drive.google.com/file/d/1ojqBsaZ7h2VBY4E5GirNn4Et4elUMRw_/view?usp=drive_link',
            background: 'https://drive.google.com/file/d/1DRTwPaVW478VHMcLiPO_8izLtF1OpbfH/view?usp=drive_link'
        };
        // Aset khusus running text: tidak mengubah logo utama/header.
        const TICKER_LOGO_ASSET = 'https://drive.google.com/file/d/1ueEqrLYS_cZRjtpcXP0LuVXrrmX0zuZ2/view?usp=drive_link';
        const TICKER_FONT_URL = 'https://drive.google.com/uc?export=download&id=16spSKn4-g3KcWqs8WASXCVS8Q8mItrUW';

        function driveFileId(raw) {
            const value = String(raw || '').trim();
            if (!value) return '';
            const match = value.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) ||
                value.match(/[?&]id=([a-zA-Z0-9_-]+)/i);
            if (match) return match[1];
            return /^[a-zA-Z0-9_-]{20,}$/.test(value) ? value : '';
        }

        function driveImageUrl(raw) {
            const value = String(raw || '').trim();
            if (!value) return '';
            const id = driveFileId(value);
            if (!id) return value;
            const key = value.match(/[?&]resourcekey=([^&#]+)/i);
            return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w2000' +
                (key ? '&resourcekey=' + key[1] : '');
        }

        function applyDriveAssets() {
            const logo = $('brandLogo');
            const tickerLogo = $('tickerLogo');
            const logoUrl = driveImageUrl(DRIVE_ASSETS.logo);
            if (logoUrl) {
                logo.hidden = false;
                logo.src = logoUrl;
                logo.onerror = () => { logo.hidden = true; console.warn('Logo Drive tidak dapat dimuat. Periksa izin berbagi.'); };
                if (tickerLogo) tickerLogo.src = logoUrl;
            } else {
                logo.hidden = true;
                logo.removeAttribute('src');
                if (tickerLogo) tickerLogo.removeAttribute('src');
            }

            // Logo running text berasal dari Drive terpisah; logo header tetap memakai aset lama.
            const tickerImageUrl = driveImageUrl(TICKER_LOGO_ASSET);
            if (tickerLogo && tickerImageUrl) {
                tickerLogo.src = tickerImageUrl;
                tickerLogo.onerror = () => console.warn('Logo running text dari Drive gagal dimuat. Periksa izin berbagi file.');
            }

            const backgroundUrl = driveImageUrl(DRIVE_ASSETS.background);
            if (backgroundUrl) {
                document.documentElement.style.setProperty('--drive-background-image', `url(${JSON.stringify(backgroundUrl)})`);
            }
        }

        // Video lokal di GitHub Pages: gunakan path relatif agar project Pages
        // (username.github.io/nama-repo/) dan custom domain sama-sama berfungsi.
        function videoSource(item) {
            const raw = typeof item === 'string'
                ? item
                : (item && (item.src || item.path || item.url || item.video)) || '';
            const value = String(raw).trim();
            if (!value) return '';
            try { return new URL(value, document.baseURI).href; }
            catch (e) { return ''; }
        }

        function videoKey(list) {
            return list.map(item => `${videoSource(item)}|${typeof item === 'string' ? '' : (item.name || '')}`).join('||');
        }

        function requestVideoPlay(video, token) {
            if (token !== state.videoLoadToken || !video.src) return;
            video.muted = true;
            video.defaultMuted = true;
            video.autoplay = true;
            video.playsInline = true;
            video.removeAttribute('controls');
            const result = video.play();
            if (result && typeof result.catch === 'function') {
                result.catch(error => {
                    // Browser/player tertentu dapat menolak autoplay. Tetap coba
                    // kembali saat media siap atau saat halaman kembali terlihat.
                    console.warn('Autoplay video ditolak oleh browser:', error && error.name, error && error.message);
                });
            }
        }

        function playVideo(index) {
            const video = $('broadcastVideo');
            const list = state.videos;
            const token = ++state.videoLoadToken;
            video.pause();
            video.removeAttribute('src');
            video.removeAttribute('controls');
            video.loop = list.length === 1;
            if (!list.length) {
                video.load();
                return;
            }
            state.videoIndex = ((index % list.length) + list.length) % list.length;
            const src = videoSource(list[state.videoIndex]);
            if (!src) return;
            video.muted = true;
            video.defaultMuted = true;
            video.autoplay = true;
            video.playsInline = true;
            video.setAttribute('muted', '');
            video.setAttribute('autoplay', '');
            video.setAttribute('playsinline', '');
            video.setAttribute('webkit-playsinline', '');
            video.src = src;
            video.load();
            const onReady = () => requestVideoPlay(video, token);
            video.addEventListener('canplay', onReady, { once: true });
            // Sebagian WebView tidak mengirim canplay tepat waktu; play() juga
            // dicoba setelah sumber dipasang. Error tetap ditangani di atas.
            setTimeout(onReady, 500);
        }

        function stopLiveHls() {
            if (state.hls) {
                try { state.hls.destroy(); } catch (error) { console.warn('Gagal menghentikan HLS:', error); }
                state.hls = null;
            }
        }

        function playLiveStream() {
            const video = $('broadcastVideo');
            const token = ++state.videoLoadToken;
            stopLiveHls();
            state.videos = [];
            state.videoIndex = 0;
            state.videoSignature = '';
            video.pause();
            video.removeAttribute('src');
            video.removeAttribute('controls');
            video.loop = true;
            video.muted = true;
            video.defaultMuted = true;
            video.autoplay = true;
            video.playsInline = true;
            video.setAttribute('muted', '');
            video.setAttribute('autoplay', '');
            video.setAttribute('playsinline', '');
            video.setAttribute('webkit-playsinline', '');
            video.load();

            if (!LIVE_STREAM_URL || !/^https:\/\//i.test(LIVE_STREAM_URL)) {
                console.error('LIVE_STREAM_URL harus menggunakan HTTPS pada halaman GitHub Pages.');
                return;
            }

            // Safari dan browser tertentu dapat memutar HLS secara native.
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = LIVE_STREAM_URL;
                video.load();
                const tryPlay = () => requestVideoPlay(video, token);
                video.addEventListener('canplay', tryPlay, { once: true });
                setTimeout(tryPlay, 700);
                return;
            }

            // Chrome/Edge menggunakan HLS.js. Server OTT harus mengizinkan CORS.
            if (window.Hls && window.Hls.isSupported()) {
                const hls = new window.Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    liveSyncDurationCount: 3
                });
                state.hls = hls;
                hls.loadSource(LIVE_STREAM_URL);
                hls.attachMedia(video);
                hls.on(window.Hls.Events.MANIFEST_PARSED, () => requestVideoPlay(video, token));
                hls.on(window.Hls.Events.ERROR, (_event, data) => {
                    if (!data || !data.fatal || state.hls !== hls) return;
                    console.error('Gangguan siaran OTT TVRI Bengkulu:', data.type, data.details);
                    if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR) {
                        hls.startLoad();
                    } else if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR) {
                        hls.recoverMediaError();
                    } else {
                        stopLiveHls();
                    }
                });
                return;
            }

            console.error('Browser ini tidak mendukung HLS. Pastikan HLS.js berhasil dimuat atau gunakan browser dengan dukungan HLS native.');
        }

        function initializeVideoSource() {
            if (VIDEO_SOURCE_MODE === 'live') {
                playLiveStream();
            } else if (VIDEO_SOURCE_MODE === 'repo') {
                loadVideoManifest();
            } else {
                console.error('VIDEO_SOURCE_MODE tidak valid. Gunakan "repo" atau "live".');
                loadVideoManifest();
            }
        }

        function setVideoPlaylist(entries) {
            const next = (Array.isArray(entries) ? entries : [])
                .filter(item => !!videoSource(item));
            const newKey = videoKey(next);
            if (newKey === state.videoSignature) return;
            const oldCurrent = state.videos[state.videoIndex];
            const oldSrc = oldCurrent ? videoSource(oldCurrent) : '';
            const keep = oldSrc ? next.findIndex(item => videoSource(item) === oldSrc) : -1;
            state.videos = next;
            state.videoSignature = newKey;
            if (!next.length) {
                playVideo(0);
            } else if (keep >= 0) {
                state.videoIndex = keep;
                const video = $('broadcastVideo');
                video.loop = next.length === 1;
                if (video.paused) requestVideoPlay(video, state.videoLoadToken);
            } else {
                playVideo(0);
            }
        }

        async function loadVideoManifest() {
            if (state.videosLoading) return;
            state.videosLoading = true;
            try {
                const response = await fetch(VIDEO_MANIFEST_URL + '?_=' + Date.now(), { cache: 'no-store' });
                if (!response.ok) throw new Error('videos.json HTTP ' + response.status);
                const data = await response.json();
                const entries = Array.isArray(data) ? data : (Array.isArray(data.videos) ? data.videos : []);
                setVideoPlaylist(entries);
            } catch (error) {
                console.error('Gagal membaca videos.json:', error);
            } finally {
                state.videosLoading = false;
            }
        }

        $('broadcastVideo').addEventListener('ended', () => {
            if (VIDEO_SOURCE_MODE === 'repo' && state.videos.length > 1) {
                playVideo((state.videoIndex + 1) % state.videos.length);

        });
        $('broadcastVideo').addEventListener('error', () => {
            const video = $('broadcastVideo');
            const code = video.error && video.error.code;
            console.error('Media video gagal dimuat:', code, video.currentSrc);
            if (VIDEO_SOURCE_MODE === 'repo') {
                console.warn('Jika file video >100 MB dan disimpan sebagai file Git biasa di GitHub, file tersebut tidak dapat dilayani oleh repositori GitHub Pages. Gunakan versi <100 MB atau sumber eksternal seperti GitHub Release asset / object storage.');
            }
        });
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) requestVideoPlay($('broadcastVideo'), state.videoLoadToken);
        });

        function normalizeRunningTexts(value) {
            const list = Array.isArray(value) ? value : (value ? [value] : []);
            return list.map(item => {
                if (typeof item === 'string') return item.trim();
                return firstText(item && item.text, item && item.message, item && item.title, item && item.teks);
            }).filter(Boolean);
        }

        let runningTextFrame = null;
        let runningTextGeneration = 0;
        let runningTextCycleWidth = 0;
        let runningTextOffset = 0;
        let runningTextLastFrameTime = null;
        let runningTextWindowLoaded = document.readyState === 'complete';
        let runningTextResizeTimer = null;
        const RUNNING_TEXT_SPEED = 68; // piksel per detik, bergerak stabil tanpa jeda

        function getTickerElements() {
            return {
                content: document.querySelector('.news-ticker-container .ticker-content'),
                text: $('runningTextDisplay')
            };
        }

        function stopRunningTextAnimation() {
            runningTextGeneration++;
            if (runningTextFrame !== null) {
                cancelAnimationFrame(runningTextFrame);
                runningTextFrame = null;
            }
            runningTextLastFrameTime = null;
        }

        function animateRunningTextFrame(now, generation) {
            if (generation !== runningTextGeneration) return;
            const { text } = getTickerElements();
            if (!text || runningTextCycleWidth <= 0) return;

            if (runningTextLastFrameTime === null || document.hidden) {
                runningTextLastFrameTime = now;
            } else {
                const elapsed = Math.min(64, Math.max(0, now - runningTextLastFrameTime));
                runningTextLastFrameTime = now;
                runningTextOffset -= RUNNING_TEXT_SPEED * elapsed / 1000;
                // Berputar tepat satu rangkaian; salinan yang identik membuat sambungan mulus.
                while (runningTextOffset <= -runningTextCycleWidth) {
                    runningTextOffset += runningTextCycleWidth;
                }
                text.style.setProperty('transform', `translate3d(${runningTextOffset.toFixed(2)}px,0,0)`, 'important');
            }
            runningTextFrame = requestAnimationFrame(time => animateRunningTextFrame(time, generation));
        }

        function renderRunningText() {
            const { content, text } = getTickerElements();
            if (!content || !text) return;

            stopRunningTextAnimation();
            const generation = runningTextGeneration;
            const list = state.runningTexts.length ? state.runningTexts : ['INFORMASI TVRI BENGKULU'];
            // Tiap pengumuman langsung disambung separator; satu pengumuman pun akan berulang terus.
            const sequenceText = list.map(item => String(item || '').trim()).filter(Boolean).join('     •     ') + '     •     ';

            text.replaceChildren();
            text.style.removeProperty('transform');
            text.style.setProperty('opacity', '1', 'important');
            const firstSequence = document.createElement('span');
            firstSequence.className = 'ticker-sequence';
            firstSequence.textContent = sequenceText || 'INFORMASI TVRI BENGKULU     •     ';
            text.appendChild(firstSequence);

            // CSS font dan ukuran akhir harus siap sebelum mengukur panjang satu siklus.
            if (!runningTextWindowLoaded) return;
            const initialize = () => {
                if (generation !== runningTextGeneration) return;
                requestAnimationFrame(() => {
                    if (generation !== runningTextGeneration) return;
                    const cycleWidth = firstSequence.getBoundingClientRect().width;
                    const viewportWidth = content.getBoundingClientRect().width || window.innerWidth;
                    if (!Number.isFinite(cycleWidth) || cycleWidth <= 0 || viewportWidth <= 0) {
                        runningTextFrame = requestAnimationFrame(time => animateRunningTextFrame(time, generation));
                        return;
                    }

                    runningTextCycleWidth = cycleWidth;
                    // Tambahkan sebanyak yang diperlukan agar layar tetap penuh, juga untuk teks pendek.
                    const copies = Math.max(3, Math.ceil(viewportWidth / cycleWidth) + 2);
                    for (let i = 1; i < copies; i++) {
                        const clone = firstSequence.cloneNode(true);
                        clone.setAttribute('aria-hidden', 'true');
                        text.appendChild(clone);
                    }
                    runningTextOffset = 0;
                    runningTextLastFrameTime = null;
                    text.style.setProperty('transform', 'translate3d(0px,0,0)', 'important');
                    runningTextFrame = requestAnimationFrame(time => animateRunningTextFrame(time, generation));
                });
            };

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(initialize, initialize);
            } else {
                requestAnimationFrame(initialize);
            }
        }

        function startRunningText() {
            renderRunningText();
        }

        window.addEventListener('load', () => {
            runningTextWindowLoaded = true;
            startRunningText();
        }, { once: true });

        window.addEventListener('resize', () => {
            clearTimeout(runningTextResizeTimer);
            runningTextResizeTimer = setTimeout(startRunningText, 180);
        });

        function formatRupiah(value) {
            const number = Number(value);
            if (!Number.isFinite(number)) return '--';
            return 'Rp ' + Math.round(number).toLocaleString('id-ID');
        }

        function renderBudget() {
            const budget = state.budget;
            const title = $('budgetTitle');
            const amount = $('budgetAmount');
            const percent = $('budgetPercent');
            const pagu = $('budgetPagu');
            const progress = document.querySelector('.budget-circle-progress');
            if (!title || !amount || !percent) return;

            if (!budget) {
                title.textContent = 'REALISASI ANGGARAN';
                amount.textContent = '--';
                if (pagu) pagu.textContent = 'Pagu: --';
                percent.textContent = '--%';
                if (progress) progress.style.strokeDashoffset = '100';
                return;
            }

            const percentage = Math.max(0, Math.min(100, Number(budget.percentage) || 0));
            const year = firstText(budget.year);
            title.textContent = year ? `REALISASI ANGGARAN ${year}` : 'REALISASI ANGGARAN';
            amount.textContent = formatRupiah(budget.realisasi);
            if (pagu) pagu.textContent = `Pagu: ${formatRupiah(budget.pagu)}`;
            percent.textContent = `${percentage.toFixed(percentage % 1 ? 1 : 0)}%`;
            if (progress) progress.style.strokeDashoffset = String(100 - percentage);
        }

        function updateData(payload, persistCache = true) {
            if (!payload || !payload.success) {
                console.warn('Data display tidak berhasil diambil:', payload && payload.error);
                return;
            }
            state.programs = (Array.isArray(payload.programs) ? payload.programs : []).map(p => ({
                ...p,
                date: firstText(p.date, p.Date, payload.today).slice(0, 10),
                start_time: firstText(p.start_time, p.startTime, p['Start time']),
                duration: firstText(p.duration, p.Duration),
                name: firstText(p.name, p.Name, p.program_name, p.programName, p.title),
                short_description: firstText(p.short_description, p.shortDescription),
                description: firstText(p.short_description, p.shortDescription, p.description, p.long_description, p.longDescription)
            }));
            state.photos = Array.isArray(payload.photos) ? payload.photos : [];
            state.runningTexts = normalizeRunningTexts(payload.runningTexts);
            state.budget = payload.budget && typeof payload.budget === 'object' ? payload.budget : null;
            startRunningText();
            renderBudget();
            // Simpan hasil terakhir agar foto dan jadwal bisa langsung ditampilkan
            // pada pembukaan berikutnya, sambil tetap mengambil data terbaru dari server.
            if (persistCache) {
                try {
                    localStorage.setItem(DISPLAY_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), payload }));
                } catch (cacheError) {
                    console.warn('Cache data Display tidak dapat disimpan:', cacheError);
                }
            }
            if (payload.programCsvError) console.warn('Jadwal CSV tidak dapat dibaca:', payload.programCsvError);
            // Jangan mengambil video dari Apps Script/Google Drive.
            // Playlist video tetap sepenuhnya dikendalikan oleh videos.json di repo GitHub.
            const photosKey = photoKey(getPhotoList());
            if (photosKey !== state.photoSignature) {
                state.photoSignature = photosKey;
                renderPhotos();
            }
            renderProgram();
        }

        // GitHub Pages memakai endpoint JSONP dari Apps Script.
        // endpoint JSONP hanya untuk data display yang memang boleh ditampilkan publik.
        const APPS_SCRIPT_URL = (window.TVRI_CONFIG && window.TVRI_CONFIG.APPS_SCRIPT_URL || '').trim();
        function restoreCachedData() {
            try {
                const raw = localStorage.getItem(DISPLAY_CACHE_KEY);
                if (!raw) return false;
                const cached = JSON.parse(raw);
                if (!cached || !cached.payload || cached.payload.success !== true) return false;
                updateData(cached.payload, false);
                return true;
            } catch (error) {
                console.warn('Cache data Display tidak dapat dibaca:', error);
                return false;
            }
        }

        function loadData() {
            if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes('PASTE_WEB_APP_EXEC_URL_HERE')) {
                console.warn('Isi APPS_SCRIPT_URL pada config.js dengan URL Web App Apps Script.');
                return;
            }
            if (state.dataLoading) return;
            state.dataLoading = true;
            const callbackName = '__tvriGithubDisplayCallback';
            const script = document.createElement('script');
            let finished = false;
            const cleanup = () => {
                if (finished) return;
                finished = true;
                state.dataLoading = false;
                if (state.dataScript === script) state.dataScript = null;
                script.remove();
                try { delete window[callbackName]; } catch (_) { window[callbackName] = undefined; }
            };
            window[callbackName] = payload => {
                try { updateData(payload); }
                finally { cleanup(); }
            };
            script.onerror = () => {
                console.error('Gagal mengambil data dari Apps Script. Periksa URL dan izin Web App.');
                cleanup();
            };
            const url = new URL(APPS_SCRIPT_URL);
            url.searchParams.set('page', 'data');
            url.searchParams.set('callback', callbackName);
            url.searchParams.set('_', String(Date.now()));
            script.src = url.toString();
            state.dataScript = script;
            document.head.appendChild(script);
            setTimeout(cleanup, 20000);
        }

        // Cuaca dan anggaran ditampilkan bersamaan.
        const budgetView = $('budgetView');
        if (budgetView) budgetView.hidden = false;

        applyDriveAssets();
        renderRunningText();
        renderBudget();
        restoreCachedData();
        renderClock(); renderProgram();
        // Hanya hitung waktu secara lokal. Tidak ada polling ke Apps Script/GitHub.
        // Data jadwal untuk hari ini dan besok sudah dimuat saat halaman dibuka.
        setInterval(() => {
            renderClock();
            renderProgram();
        }, 1000);
        loadData();
        initializeVideoSource();
        loadWeather();
        setInterval(loadWeather, BMKG_REFRESH_MS);
    </script>
